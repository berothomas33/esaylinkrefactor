// Top-level build file — AGP 8.2 / JDK 17 multi-module. core / network / app are Kotlin +
// coroutines; the PAX SDK modules stay Java (claudekotlin.md §4).
plugins {
    id 'com.android.application' version '8.2.2' apply false
    id 'com.android.library' version '8.2.2' apply false
    // 1.9.22 is the newest Kotlin AGP 8.2.2 is tested with.
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
}

ext {
    compileSdkVersion = 34
    minSdkVersion = 24
    targetSdkVersion = 34

    androidAppcompat = '1.6.1'
    constraintlayout = '2.1.4'
    material = '1.11.0'
    greendao = '3.3.0'
    sqlcipher = '4.5.4'
    // Must match the version sqlcipher resolves at runtime.
    androidxSqlite = '2.2.0'
    multidex = '2.0.1'
    fastjson = '1.1.72.android'
    coroutines = '1.7.3'
    lifecycle = '2.6.2'
    fragmentKtx = '1.6.2'
    glide = '4.16.0'
    retrofit2 = '2.9.0'
    okhttp3 = '4.9.1'
    gson = '2.10'

    junit = '4.13.2'
    mockito = '1.10.19'
    hamcrest = '1.3'
    coreTesting = '2.2.0'
    runner = '1.5.2'
    espresso = '3.5.1'
    androidxExtJunit = '1.1.5'

    // SQLCipher password for the PAX demo database, quoted for
    // buildConfigField('String', 'DATABASE_PWD', ...). Override it locally in
    // ~/.gradle/gradle.properties rather than committing a real credential.
    DATABASE_PWD = project.findProperty('DATABASE_PWD') ?: '"CHANGE_ME"'

    // orchestration/sale's required mToken header — see HostAppKeys#MTOKEN's javadoc for what this
    // is and why it isn't a literal. Same pattern as DATABASE_PWD above: override locally in
    // ~/.gradle/gradle.properties rather than committing a real captured credential.
    MTOKEN_TEMP = project.findProperty('MTOKEN_TEMP') ?: '"CHANGE_ME"'
}
