# WMRouter's annotation processor (compiler:1.2.1) reads internal javac APIs that
# JDK 16+ strongly encapsulates. Without these exports it dies with IllegalAccessError.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 --add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false
# Keep packaging of legacy armeabi PAX JNI libs
android.injected.testOnly=false

# DATABASE_PWD is deliberately not set here. Override it locally in
# ~/.gradle/gradle.properties, e.g. DATABASE_PWD="yourPassword"
# Root build.gradle falls back to a placeholder when it is absent.

# MTOKEN_TEMP (orchestration/sale's required mToken header — see HostAppKeys#MTOKEN) is the same
# story: deliberately not set here. Override it locally in ~/.gradle/gradle.properties, e.g.
# MTOKEN_TEMP="<a real captured mToken JWT>". Root build.gradle falls back to a placeholder when
# it is absent, and every sale will 400/401 on this header until either a real value is set
# locally or the real mint endpoint is found and this is replaced with a live call.
