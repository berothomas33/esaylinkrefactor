plugins {
    id 'com.android.library'
}

android {
    namespace 'com.pax.emvservice'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {

            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {

        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
    }

}

dependencies {

    api fileTree(include: ["*.jar"], dir: "libs")
    api project(":pax-libs:ours:bizentity")
    api project(":pax-libs:sdk:emvbase")
    api project(":pax-libs:sdk:emvlib")
    api project(":pax-libs:sdk:commonutils")
    api project(":pax-libs:sdk:bizlib")
    api project(":pax-libs:sdk:poslib")

}
