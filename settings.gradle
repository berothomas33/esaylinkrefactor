pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    // PAX proprietary jars/aars are consumed via fileTree/files(), not flatDir,
    // so no module needs its own repositories block.
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "EmvEnhanceRefactor"

include ':app'
include ':core'
include ':vendor-fake'
include ':vendor-ingenico'
include ':vendor-pax'
include ':network'

// PAX EMV stack, inside the PAX vendor: vendor-pax/libs/ — only :vendor-pax depends on it (core,
// app/src/main, network, fake and ingenico never import com.pax), so everything PAX lives in one
// folder. The Gradle path is the folder, so Android Studio's Android view groups them too:
//   vendor-pax/libs/sdk  — PAX's own SDK code; touched only for a clear EMV reason
//   vendor-pax/libs/ours — PAX-only modules we write and change: the device runtime and the parameters
include ':vendor-pax:libs:sdk:emvbase'
include ':vendor-pax:libs:sdk:emvlib'
include ':vendor-pax:libs:sdk:emvlib:dpas'
include ':vendor-pax:libs:sdk:emvlib:base'
include ':vendor-pax:libs:sdk:emvservice'
include ':vendor-pax:libs:sdk:commonutils'
include ':vendor-pax:libs:sdk:poslib'
include ':vendor-pax:libs:sdk:bizlib'
include ':vendor-pax:libs:ours:emvflow'
include ':vendor-pax:libs:ours:bizentity'
