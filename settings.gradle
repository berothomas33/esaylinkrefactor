pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    // PAX proprietary jars/aars are consumed via fileTree/files(), not flatDir,
    // so no module needs its own repositories block.
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "EmvEnhanceRefactor"

include ':app'
include ':core'
include ':vendor-fake'
include ':vendor-ingenico'
include ':vendor-pax'
include ':network'

// PAX EMV stack, under pax-libs/ — only :vendor-pax depends on it (core, app/src/main, network,
// fake and ingenico never import com.pax). The Gradle path is the folder, so Android Studio's
// Android view groups them too:
//   pax-libs/sdk  — PAX's own SDK code; touched only for a clear EMV reason
//   pax-libs/ours — PAX-only modules we write and change: the device runtime and the parameters
include ':pax-libs:sdk:emvbase'
include ':pax-libs:sdk:emvlib'
include ':pax-libs:sdk:emvlib:dpas'
include ':pax-libs:sdk:emvlib:base'
include ':pax-libs:sdk:emvservice'
include ':pax-libs:sdk:commonutils'
include ':pax-libs:sdk:poslib'
include ':pax-libs:sdk:bizlib'
include ':pax-libs:ours:emvflow'
include ':pax-libs:ours:bizentity'
