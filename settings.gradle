pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    // PAX proprietary jars/aars are consumed via fileTree/files(), not flatDir,
    // so no module needs its own repositories block.
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "EmvEnhanceRefactor"

include ':app'
include ':core'
include ':vendor-fake'
include ':vendor-ingenico'
include ':vendor-pax'
include ':network'

// PAX EMV stack — only :vendor-pax depends on it (core, app/src/main, network, fake and ingenico
// never import com.pax). The Gradle names stay the short ones (':poslib', not ':pax-libs:sdk:poslib'),
// so no build.gradle dependency changes.
//   pax-libs/sdk  — PAX's own SDK code; touched only for a clear EMV reason
//   pax-libs/ours — PAX-only modules we write and change: the device runtime and the parameters
def paxLibs = [
        ':emvbase'    : 'sdk/emvbase',
        ':emvlib'     : 'sdk/emvlib',
        ':emvlib:dpas': 'sdk/emvlib/dpas',
        ':emvlib:base': 'sdk/emvlib/base',
        ':emvservice' : 'sdk/emvservice',
        ':commonutils': 'sdk/commonutils',
        ':poslib'     : 'sdk/poslib',
        ':bizlib'     : 'sdk/bizlib',
        ':emvflow'    : 'ours/emvflow',
        ':bizentity'  : 'ours/bizentity',
]
paxLibs.each { path, dir ->
    include path
    project(path).projectDir = file("pax-libs/$dir")
}
