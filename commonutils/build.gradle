plugins {
    id 'com.android.library'
}

android {
    namespace 'com.pax.commonutils'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
    }
}

dependencies {
    api "androidx.appcompat:appcompat:$rootProject.androidAppcompat"
    api "com.alibaba:fastjson:$rootProject.fastjson"
    api "androidx.multidex:multidex:$rootProject.multidex"
    api "org.greenrobot:greendao:$rootProject.greendao"
    api "net.zetetic:android-database-sqlcipher:$rootProject.sqlcipher"
    // sqlcipher's SQLiteDatabase implements SupportSQLiteDatabase but declares
    // androidx.sqlite runtime-only, so consumers can't compile against it.
    api "androidx.sqlite:sqlite:$rootProject.androidxSqlite"
    api "io.reactivex.rxjava3:rxjava:$rootProject.rxjava3"
    api "io.reactivex.rxjava3:rxandroid:$rootProject.rxandroid3"
    api "com.trello.rxlifecycle4:rxlifecycle-android-lifecycle:$rootProject.rxlifecycle4"
}
