// The PAX vendor: PaxTerminal, PaxEmvBehavior, PaxKernel and the rest of the PAX A920 code, over
// the PAX SDK modules. Only this module (and the app's pax debug screens, through it) sees the
// PAX SDK; core and app/src/main never do (rule 14).
plugins {
    id 'com.android.library'
}

android {
    namespace 'com.emvenhance.vendor.pax'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true // BuildConfig.DEBUG (PaxEmvBehavior's app-select dialog)
    }

    lint {
        abortOnError false
    }
}

dependencies {
    api project(':core')
    api project(':network')
    // api: the app's pax debug screens (EMV params, onboarding, country) use the PAX SDK too.
    api project(':emvflow')
    api project(':emvservice')
    api project(':bizentity')
    api project(':bizlib')
    api project(':commonutils')

    implementation 'androidx.annotation:annotation:1.7.1'
    implementation "androidx.appcompat:appcompat:$rootProject.androidAppcompat"
}
