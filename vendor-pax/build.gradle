// The PAX vendor: PaxTerminal, PaxEmvBehavior, PaxKernel and the rest of the PAX A920 code, over
// the PAX SDK modules. Only this module sees the PAX SDK; core and the app never do (rule 14) -
// the app reaches PAX only through PosTerminal.
plugins {
    id 'com.android.library'
}

android {
    namespace 'com.emvenhance.vendor.pax'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true // BuildConfig.DEBUG (PaxEmvBehavior's app-select dialog)
    }

    lint {
        abortOnError false
    }
}

dependencies {
    api project(':core')
    // api: VendorApplication extends its BaseApplication, so the app needs it to compile
    // EmvEnhanceApp. Nothing else of the PAX SDK reaches the app.
    api project(':vendor-pax:libs:sdk:commonutils')
    implementation project(':network')
    implementation project(':vendor-pax:libs:ours:emvflow')
    implementation project(':vendor-pax:libs:sdk:emvservice')
    implementation project(':vendor-pax:libs:ours:bizentity')
    implementation project(':vendor-pax:libs:sdk:bizlib')

    implementation 'androidx.annotation:annotation:1.7.1'
    implementation "androidx.appcompat:appcompat:$rootProject.androidAppcompat"

    testImplementation "junit:junit:$rootProject.junit"
}
