// The Ingenico vendor (stub until the Ingenico SDK is wired in): IngenicoTerminal,
// IngenicoEmvBehavior. Depends on core only; its SDK modules go here when they arrive (rule 14).
plugins {
    id 'com.android.library'
}

android {
    namespace 'com.emvenhance.vendor.ingenico'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    api project(':core')
    implementation 'androidx.annotation:annotation:1.7.1'

    testImplementation "junit:junit:$rootProject.junit"
}
