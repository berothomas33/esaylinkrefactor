// The Ingenico vendor (stub until the Ingenico SDK is wired in): IngenicoTerminal, IngenicoEmvBehavior,
// IngenicoPinPad. Depends on core only; its SDK modules go here when they arrive (rule 14).
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.emvenhance.vendor.ingenico'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        abortOnError false
    }
}

dependencies {
    api project(':core')
}
