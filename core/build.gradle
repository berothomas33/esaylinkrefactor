plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.emvenhance.core'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
    }

    testOptions {
        // android.util.Log (used by ApduTrace/EmvLog) returns defaults instead of throwing.
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // Flow / SharedFlow / StateFlow in the API (transaction steps, APDU trace), suspend ports.
    api "org.jetbrains.kotlinx:kotlinx-coroutines-core:$rootProject.coroutines"

    testImplementation "junit:junit:$rootProject.junit"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$rootProject.coroutines"
}
