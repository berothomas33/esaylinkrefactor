plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
// WMRouter's plugin can't run on this AGP version — see the note in the root build.gradle.
// annotationProcessor alone (below) generates each module's own registrations, but nothing
// combines them, so ServiceLoader.lazyInit() never finds a populated registry.
// That's a known, permanent limitation here, not a bug to chase further.
android {
    namespace 'com.emvenhance'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.emvenhance.refactor"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true

        ndk {
            abiFilters 'armeabi', 'armeabi-v7a'
        }
    }

    buildTypes {
        debug { }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Each "vendor" flavor picks one vendor module (:vendor-pax / :vendor-ingenico /
    // :vendor-fake, see dependencies) — an ingenico/fake build never touches the PAX SDK modules
    // (emvlib/emvservice/bizentity/bizlib/emvflow) at all.
    //
    // "environment" selects which host BuildConfig.baseUrl gets baked in — read by
    // EnvironmentProvider.setBaseUrl(BuildConfig.baseUrl) in EmvEnhanceApp.onCreate(), same
    // compile-time-variant approach the old project used (Constants.EndPoint per build), not a
    // runtime switch. Ported verbatim from the old project's build.gradle.
    //
    // "production" — dev/staging/live — carries no buildConfigField yet; the old project's
    // config was cut off before whatever these three set. Wired as a dimension so variants
    // resolve, pending the rest of that config.
    flavorDimensions = ["vendor", "environment", "production"]
    productFlavors {
        pax {
            dimension "vendor"
            applicationIdSuffix ".pax"
            buildConfigField 'String', 'VENDOR', '"PAX"'
        }
        ingenico {
            dimension "vendor"
            applicationIdSuffix ".ingenico"
            buildConfigField 'String', 'VENDOR', '"INGENICO"'
        }
        fake {
            dimension "vendor"
            applicationIdSuffix ".fake"
            buildConfigField 'String', 'VENDOR', '"FAKE"'
        }

        prod {
            dimension "environment"
            buildConfigField "String", "baseUrl", "\"https://payment.alahlymomkn.com/prod/api/v1/\""
        }
        envtest {
            dimension "environment"
            buildConfigField "String", "baseUrl", "\"https://test-payment.alahlymomkn.com/api/v1/\""
        }
        uat {
            dimension "environment"
            buildConfigField "String", "baseUrl", "\"https://test-payment.alahlymomkn.com/uat/api/v1/\""
        }
        uatr3 {
            dimension "environment"
            buildConfigField "String", "baseUrl", "\"https://payment.alahlymomkn.com/uatr3/api/v1/\""
        }
        bank {
            dimension "environment"
            buildConfigField "String", "baseUrl", "\"https://Payment.alahlymomkn.com/api/v1/\""
        }
        pos_as_atm {
            dimension "environment"
            buildConfigField "String", "baseUrl", "\"https://Payment.alahlymomkn.com/pos-as-atm/api/v1/\""
        }
        dss {
            dimension "environment"
            buildConfigField "String", "baseUrl", "\"https://Payment.alahlymomkn.com/pci-dss/api/v1/\""
        }

        dev {
            dimension "production"
        }
        staging {
            dimension "production"
        }
        live {
            dimension "production"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    lint {
        abortOnError false
    }

    testOptions {
        // android.util.Log (EmvLog, HostDefaults.logPrinter) returns defaults instead of throwing.
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation project(':core')
    implementation project(':network')

    // Each vendor is its own module: its code can't reach the app, and the app reaches it only
    // through com.emvenhance.vendor.TerminalFactory / VendorApplication and PosTerminal. Every
    // screen is in src/main; the vendor flavors only pick the module.
    paxImplementation project(':vendor-pax')
    ingenicoImplementation project(':vendor-ingenico')
    fakeImplementation project(':vendor-fake')

    implementation "androidx.appcompat:appcompat:$rootProject.androidAppcompat"
    implementation "com.google.android.material:material:$rootProject.material"
    implementation "androidx.constraintlayout:constraintlayout:$rootProject.constraintlayout"
    implementation 'androidx.multidex:multidex:2.0.1'

    // viewModelScope / lifecycleScope / repeatOnLifecycle; Dispatchers.Main for Android.
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$rootProject.coroutines"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$rootProject.lifecycle"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$rootProject.lifecycle"
    implementation "androidx.fragment:fragment-ktx:$rootProject.fragmentKtx"

    testImplementation "junit:junit:$rootProject.junit"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$rootProject.coroutines"
}
