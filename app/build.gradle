plugins {
    id 'com.android.application'
}
// WMRouter registry via annotationProcessor + ServiceLoader.lazyInit() (no Gradle plugin)
android {
    namespace 'com.emvenhance'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.emvenhance.refactor"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true

        ndk {
            abiFilters 'armeabi', 'armeabi-v7a'
        }
    }

    buildTypes {
        debug { }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Each flavor compiles only its own vendor sources (src/pax, src/ingenico, src/fake) and
    // pulls in only the module dependencies that vendor actually needs — an ingenico/fake build
    // never touches the PAX SDK modules (emvlib/emvservice/configservice/bizlib/emvflow) at all.
    flavorDimensions = ["vendor"]
    productFlavors {
        pax {
            dimension "vendor"
            applicationIdSuffix ".pax"
            buildConfigField 'String', 'VENDOR', '"PAX"'
        }
        ingenico {
            dimension "vendor"
            applicationIdSuffix ".ingenico"
            buildConfigField 'String', 'VENDOR', '"INGENICO"'
        }
        fake {
            dimension "vendor"
            applicationIdSuffix ".fake"
            buildConfigField 'String', 'VENDOR', '"FAKE"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation project(':core')
    implementation project(':commonlib')

    // PAX only: IngenicoTerminal/FakeTerminal never touch the PAX SDK, so the ingenico/fake
    // flavors don't need it on their classpath at all.
    paxImplementation project(':emvflow')
    paxImplementation project(':emvservice:emv')
    paxImplementation project(':configservice:impl')
    paxImplementation project(':bizlib')

    implementation "androidx.appcompat:appcompat:$rootProject.androidAppcompat"
    implementation "com.google.android.material:material:$rootProject.material"
    implementation "androidx.constraintlayout:constraintlayout:$rootProject.constraintlayout"
    implementation 'androidx.multidex:multidex:2.0.1'

    implementation "io.reactivex.rxjava3:rxjava:$rootProject.rxjava3"
    implementation "io.reactivex.rxjava3:rxandroid:$rootProject.rxandroid3"

    annotationProcessor "io.github.meituan-dianping:compiler:$rootProject.routerCompiler"
}
